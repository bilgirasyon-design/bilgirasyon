<!doctype html>
<html lang="{{LANGUAGE}}">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>{{TITLE}}</title>

  <meta
    name="description"
    content="{{DESCRIPTION}}"
  >

  <meta
    name="robots"
    content="{{ROBOTS}}"
  >

  <link
    rel="canonical"
    href="{{CANONICAL_URL}}"
  >

  <link
    rel="stylesheet"
    href="/css/base.css"
  >

  <link
    rel="stylesheet"
    href="/css/layout.css"
  >

  <link
    rel="stylesheet"
    href="/css/components.css"
  >

  <link
    rel="stylesheet"
    href="/css/header.css"
  >

  <link
    rel="stylesheet"
    href="/css/article.css"
  >

  <link
    rel="stylesheet"
    href="/css/responsive.css"
  >

  {{ARTICLE_META}}

  {{OPEN_GRAPH}}

  {{TWITTER_CARD}}

  <script type="application/ld+json">
{{SCHEMA}}
  </script>
</head>

<body>

  <header class="site-header">

    <div class="site-header__inner">

      <a
        class="site-brand"
        href="/"
        aria-label="Bilgirasyon Ana Sayfa"
      >
        <span class="site-brand__text">
          Bilgirasyon
        </span>
      </a>

      <nav
        class="site-navigation"
        aria-label="Ana navigasyon"
      >

        <ul class="site-navigation__list">

          <li class="site-navigation__item">
            <a
              class="site-navigation__link"
              href="/"
            >
              Ana Sayfa
            </a>
          </li>

          <li class="site-navigation__item">
            <a
              class="site-navigation__link"
              href="/teknoloji/"
            >
              Teknoloji
            </a>
          </li>

        </ul>

      </nav>

      <div class="site-header__actions">

        <button
          class="site-header__menu-button"
          type="button"
          aria-label="Menüyü aç"
          aria-expanded="false"
        >
          <span class="site-header__menu-icon"></span>
        </button>

      </div>

    </div>

  </header>

  <main class="site-main">

    <div class="site-container">

      <div class="content-grid">

        <div class="content-grid__main">

          <article>

            <div class="article">

              <header class="article-header">

                <h1 class="article-title">
                  {{TITLE}}
                </h1>

              </header>

              {{TOC}}

              <div class="article-content">
                {{CONTENT}}
              </div>

              {{INTERNAL_LINKS}}

              {{RELATED_POSTS}}

            </div>

          </article>

        </div>

      </div>

    </div>

  </main>

  <footer class="site-footer">

    <div class="site-footer__inner">

      <div class="site-footer__grid">

        <section class="site-footer__section">

          <h2 class="site-footer__title">
            Bilgirasyon
          </h2>

          <p class="site-footer__text">
            Teknolojiyi anlayın, geleceği keşfedin.
          </p>

        </section>

        <section class="site-footer__section">

          <h2 class="site-footer__title">
            Kategoriler
          </h2>

          <nav aria-label="Footer kategorileri">

            <ul class="link-list">

              <li>
                <a href="/teknoloji/">
                  Teknoloji
                </a>
              </li>

            </ul>

          </nav>

        </section>

      </div>

      <div class="site-footer__bottom">

        <p class="site-footer__copyright">
          © Bilgirasyon. Tüm hakları saklıdır.
        </p>

      </div>

    </div>

  </footer>

</body>

</html>
